name: pages
on:
  # Rebuild when release notes / site source change on main
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'whats-new/**'
      - '.github/workflows/pages.yml'
  # Rebuild whenever a GitHub Release is published (version tag flow)
  release:
    types: [published]
  workflow_dispatch:

# least privilege: read-only by default; write only where needed
permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned to a full commit SHA (tags are mutable); bump SHA and comment together
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build What's new site
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 whats-new/build.py .
          test -f whats-new/dist/index.html
          test -f whats-new/dist/style.css
          test -f whats-new/dist/app.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path("whats-new/dist/index.html").read_text(encoding="utf-8")
          assert 'class="card"' in html
          assert "Download zip" in html
          print("dist ok")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: whats-new/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
