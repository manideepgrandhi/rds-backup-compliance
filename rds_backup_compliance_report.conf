## rds_backup_compliance_report.conf - the ONE settings file for rds_backup_compliance_report.sh (v1.7.1)
##
## Keep this file next to the script. It is loaded automatically and every setting must be in it:
## the script has no built-in values. Use --config FILE to run with another complete copy.
##
## How to read it:
##   Lines starting with ## are notes. Every other line is one setting:  key=value
##   An empty value (key=) means what the note above it says. Each key appears once.
##   Command-line options override a value for one run, e.g. --daily 14 or -r us-east-1.
##
## Check it without calling AWS:   ./rds_backup_compliance_report.sh --check-config
## Fake account numbers below: replace them with yours.


## ============================== Accounts and regions ==============================
## AWS CLI profiles, comma-separated, one per account (e.g. prod,nonprod,dev).
## Empty = the account you are logged in to (for example the jump box IAM role).
profile=
## yes = every enabled region. no = only region= below (empty: the profile's default region).
all-regions=yes
region=
## Engine and identifier filters, comma-separated globs (e.g. aurora-*,postgres). Empty = all.
engine=
identifier=


## ============================== Schedule ==============================
## How the weekly / monthly / daily backups are checked.
##   schedule = a point on each scheduled day: weekly-weekday, monthly-rule and tolerance-days apply.
##   counts   = at least N points in a window, whatever weekday they ran on. A backup re-run a day or two late
##              counts. weekly-weekday, monthly-rule and tolerance-days are then ignored (keep them in the file).
##              daily: N of the last N days have an automated backup. weekly: weekly= points (auto = 4 for 30 days)
##              in the last weekly-window-days days. monthly: monthly= points in the last monthly= months.
check-mode=schedule
## RDS automated backups: retention of at least N days and one backup on each of the last N days.
daily=7
## The newest automated backup must be at most this many HOURS old.
daily-max-age=26
## AWS Backup weekly point: the day it runs and how many days it is kept.
## The weekly check looks back over the same number of days.
weekly-weekday=sat
weekly-retention-days=30
## AWS Backup monthly point: first <day> of the month, how many months are checked, and how long it is kept.
monthly-rule=first-sun
monthly=12
monthly-retention-days=365
## Read replicas / global secondaries of these engines are always COMPLIANT (no backups expected).
## Empty = they get the daily check only.
replica-exempt-engines=oracle-*,aurora-*


## ============================== Output ==============================
## Formats: text, csv, json, html (comma-separated). Several formats need output-dir.
format=html,csv
## Folder for the report files (relative paths start from the folder you run the script in).
## Empty = print one format to the screen.
output-dir=./reports
## Second time zone shown next to UTC.
tz=Asia/Kolkata
## yes = list only NON-COMPLIANT servers (the totals still count everything).
non-compliant-only=no
## Log of every run (appended). Empty = no log file.
log-file=./reports/run.log


## ============================== Snapshot audit ==============================
## Also list manual snapshots older than N days (a separate CSV). Empty = off.
manual-older-than=90
## Snapshot storage price in USD per GB-month, for the orphaned-snapshot cost estimate.
snapshot-price-per-gb=0.021


## ============================== Report retention ==============================
## After each run, delete this tool's report files (name starts with prefix; .html .csv .json .txt)
## older than N days from output-dir. Other files are never touched. 0 = keep everything.
keep-reports=30


## ============================== Email ==============================
## Who gets the summary e-mail (comma-separated), e.g. dba-team@example.com,oncall@example.com.
## Empty = no e-mail. Sent with mail / mailx, or sendmail (sendmail also attaches the HTML report).
alert-email=
## From address. Empty = the mail system's default.
alert-from=
## noncompliant = only when a server is NON-COMPLIANT or an AWS call failed. always = after every run.
alert-on=noncompliant


## ============================== Account names (display only) ==============================
## 12-digit account number = friendly name, shown as "name (number)" in the reports.
## Accounts not listed show their IAM account alias, else the number.
111111111111 = prod-payments
222222222222 = nonprod-shared


## ============================== Advanced (rarely changed) ==============================
## Weekly points expected: auto = every weekly-weekday in the weekly window; a number N = the last N.
weekly=auto
## Weekly window in days. Empty = the same as weekly-retention-days.
weekly-window-days=
## Retention ranges (days) that make an AWS Backup point count as weekly or as monthly.
weekly-days=25-40
monthly-days=300-400
## A point counts for a scheduled day if it was taken up to N days before or after it (0-3).
tolerance-days=1
## Expected RDS backup retention in days (more is highlighted). Empty = the same as daily.
daily-retention-days=
## Allowed difference in days from the expected retention before a point is highlighted.
retention-tolerance-days=1
## Yearly AWS Backup points expected (retention above the monthly range). 0 = off.
yearly=0
## Regions of one account scanned at the same time (1-32; 1 = one by one).
parallel=4
## Start of every report file name.
prefix=rds_backup_compliance
## AWS CLI connect / read timeout in seconds, and retry attempts.
aws-timeout=30
max-attempts=5
## Seconds the mail command may take before it is stopped.
mail-timeout=60
## yes = exit code 5 when a server is NON-COMPLIANT (for schedulers / CI).
fail-on-noncompliant=no
## yes = also save the raw data for a later --merge (rds_backup_<account>_<date>.json).
save-data=no
## Compliance exceptions file. Empty = compliance_exceptions.conf next to the script, if it exists.
exceptions=
